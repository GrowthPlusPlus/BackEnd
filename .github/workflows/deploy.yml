name: Haeneam Integrated Deployment

on:
  push:
    branches: [ "develop" ] # 또는 develop 브랜치로 설정

concurrency:
  group: haeneam-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # GitHub Actions 러너 IP를 Vultr 방화벽에 임시 등록
      - name: Allow GitHub Actions IP
        id: firewall
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          FIREWALL_ID: ${{ secrets.VULTR_FIREWALL_GROUP_ID }}
        run: |
          set -euo pipefail

          RUNNER_IP=$(curl -fsS -4 https://api.ipify.org)
          echo "GitHub Actions runner IP: $RUNNER_IP"

          RESPONSE=$(curl -fsS --retry 3 \
            -X POST \
            "https://api.vultr.com/v2/firewalls/$FIREWALL_ID/rules" \
            -H "Authorization: Bearer $VULTR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg ip "$RUNNER_IP" '{
              ip_type: "v4",
              protocol: "tcp",
              port: "22",
              subnet: $ip,
              subnet_size: 32,
              notes: "github-actions-temporary"
            }')")

          RULE_ID=$(echo "$RESPONSE" | jq -r '.firewall_rule.id // empty')

          if [ -z "$RULE_ID" ]; then
            echo "Failed to retrieve firewall rule ID"
            exit 1
          fi

          echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"
          echo "Temporary SSH rule created"

          # 방화벽 규칙 반영 대기
          sleep 45

      # 연결 테스트
      - name: Test SSH Port
        shell: bash
        env:
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
        run: |
          echo "Runner public IP:"
          curl -fsS -4 https://api.ipify.org
          echo
      
          echo "Testing SSH port 22..."
      
          if timeout 10 bash -c 'echo > /dev/tcp/"$1"/22' _ "$VULTR_HOST"; then
            echo "SSH port 22 reachable"
          else
            echo "SSH port 22 unreachable"
            exit 1
          fi

      - name: Deploy to Vultr
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VULTR_HOST }} #
          username: ${{ secrets.VULTR_USERNAME }} #
          password: ${{ secrets.VULTR_PASSWORD }} # 비밀번호 방식일 경우
          timeout: 60s  # SSH 연결 대기 시간 30초 → 60초
          # key: ${{ secrets.SSH_KEY }} # 만약 키 방식을 쓰신다면 이 줄을 사용하세요.
          script: |
            # 명령어 실패 시 배포 중단
            set -e
            
            # 1. 통합 프로젝트 폴더로 이동
            cd ~/hanaem

            # 2. BackEnd 업데이트 및 환경변수 설정
            cd BackEnd
            git pull origin develop
            git reset --hard origin/develop  # 로컬 변경사항 무시하고 원격 코드로 강제 일치
            
            # GitHub Secrets를 사용하여 .env 파일 생성
            echo "DB_URL=${{ secrets.DB_URL  }}" > .env
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
            echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> .env
            echo "KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}" >> .env
            echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> .env
            echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> .env
            echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
            echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> .env
            echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env
            echo "APP_BASE_URL=${{ secrets.APP_BASE_URL }}" >> .env
            echo "CLIP_BASE_URL=${{ secrets.CLIP_BASE_URL }}" >> .env
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env

            # 3. CLIP 이동 및 업데이트
            cd ~/hanaem/CLIP
            git pull origin main
            git reset --hard origin/main  # 여기도 강제로 맞춤

            # 4. Docker Compose 통합 재배포
            cd ~/hanaem
            # 기존 컨테이너를 내리고 이미지를 새로 빌드하여 백그라운드 실행
            docker compose down
            docker compose build --no-cache backend  # --no-cache를 추가하여 캐시를 쓰지 않고 소스코드를 새로 구움
            docker compose up -d

      # 배포 완료 후 임시 SSH 허용 규칙 삭제
      - name: Remove GitHub Actions IP
        if: ${{ always() && steps.firewall.outputs.rule_id != '' }}
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          FIREWALL_ID: ${{ secrets.VULTR_FIREWALL_GROUP_ID }}
          RULE_ID: ${{ steps.firewall.outputs.rule_id }}
        run: |
          set -euo pipefail
          
          curl -fsS --retry 3 \
            -X DELETE \
            "https://api.vultr.com/v2/firewalls/$FIREWALL_ID/rules/$RULE_ID" \
            -H "Authorization: Bearer $VULTR_API_KEY"
          
          echo "Temporary SSH rule removed"