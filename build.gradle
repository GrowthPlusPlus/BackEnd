plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.0'

    // 코틀린
    id "org.jetbrains.kotlin.jvm" version "1.9.25"
    id "org.jetbrains.kotlin.plugin.spring" version "1.9.25"
}

// Java 17 (Spring Boot 3.x 필수)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

group = 'org.example'
version = '1.0-SNAPSHOT'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

// Spring AI BOM으로 rag 버전 통합 관리를 위한 의존성
ext {
    springAiVersion = '1.0.0-M6'
}

dependencyManagement {  // Spring AI 관련 라이브러리의 버전을 관리해준다.
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    /*
        ANTLR 버전 불일치 경고 제거용
        Hibernate 내부 파서가 4.10.1 기준으로 생성되어 있으므로 Runtime도 4.10.1로 맞춘다
     */
    implementation 'org.antlr:antlr4-runtime:4.10.1'

    // 중요 스프링 의존성
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 코틀린 의존성
    implementation "org.jetbrains.kotlin:kotlin-reflect"
    implementation "org.jetbrains.kotlin:kotlin-stdlib"

    runtimeOnly 'org.postgresql:postgresql'  // postgre sql 드라이버 추가
    runtimeOnly 'com.h2database:h2'  // test용 h2 DB

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    testImplementation 'org.springframework.security:spring-security-test'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // jwt 의존성
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // PKCE / Google OAuth 인증을 위한 새로운 의존성 주입
    implementation 'org.springframework.boot:spring-boot-starter-webflux'  // Spring 6+ HTTP 클라이언트 (RestClient 사용) -> google 토큰 교환용
    // (선택) ID Token 검증을 하려면 Google 공식 라이브러리 사용
    implementation 'com.google.api-client:google-api-client:2.6.0'
    implementation 'com.google.oauth-client:google-oauth-client:1.36.0'
    implementation 'com.google.http-client:google-http-client-jackson2:1.44.1'

    // OpenAPI명세서 생성을 위한 관련 의존성 추가
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // 클라우디너리 의존성을 추가한다.
    implementation 'com.cloudinary:cloudinary-http44:1.37.0'

    // OpenAI 연동 (Chat / Embedding)
    implementation 'org.springframework.ai:spring-ai-openai-spring-boot-starter'

    // pgvector 기반 VectorStore
    implementation 'org.springframework.ai:spring-ai-pgvector-store'

    // PDF를 처리하기 위한 의존성 (RAG 소스 문서)
    implementation 'org.apache.pdfbox:pdfbox:2.0.27'

    // 디버깅을 위한 로깅 의존성
    implementation 'io.github.oshai:kotlin-logging:6.0.3'

    // 스케줄러의 초기화되지 않은 DB 참조 방지를 위한 AOP 의존성
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Spring Retry를 사용하여 재시도 및 복구 로직을 구현하기 위한 의존성이다.
    implementation 'org.springframework.retry:spring-retry'

    //firebase FCM의존성
    implementation 'com.google.firebase:firebase-admin:9.2.0'

    //재시도 로직을 위한 의존성
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.retry:spring-retry'
}

test {
    useJUnitPlatform()
}

jar {
    enabled = false
}