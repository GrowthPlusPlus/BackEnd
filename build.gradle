plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.0'
}

// build.gradle 파일의 plugins 바로 아래쯤에 추가
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

group = 'org.example'
version = '1.0-SNAPSHOT'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    testImplementation 'org.springframework.security:spring-security-test'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.projectlombok:lombok'

    /*
        보안을 위해 0.9.1 버전 비활성화

    //implementation 'io.jsonwebtoken:jjwt:0.9.1'
    //implementation 'javax.xml.bind:jaxb-api:2.3.1'
     */
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // pkce 인증을 위한 새로운 의존성 주입

    // Spring 6+ HTTP 클라이언트 (RestClient 사용) -> google 토큰 교환용
    implementation 'org.springframework.boot:spring-boot-starter-webflux' // WebClient/RestClient에 필요할 수 있음(환경 따라)
    // (선택) ID Token 검증을 하려면 Google 공식 라이브러리 사용
    implementation 'com.google.api-client:google-api-client:2.6.0'
    implementation 'com.google.oauth-client:google-oauth-client:1.36.0'
    implementation 'com.google.http-client:google-http-client-jackson2:1.44.1'

    //implementation 'org.springframework.boot:spring-boot-starter-oauth2-client' //  웹 로그인 용 OAuth2
}

test {
    useJUnitPlatform()
}

jar {
    enabled = false
}