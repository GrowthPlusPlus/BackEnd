spring:
  datasource:
    url: jdbc:h2:mem:testdb  # db값이 유지되도록 나중에 바꿔야 한다
    username: sa

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true

# data.sql을 실행하지 않는다.
  sql:
    init:
      mode: always

# 웹 기반 OAUTH 설정으로 비활성화
#  security:
#    oauth2:
#      client:
#        registration:
#          google:
#            client-id: test_id            # 고유한 값으로 바꾸지 않으면 OAuth 인증 시 문제 발생
#            client-secret: test_secret
#            scope:
#              - email
#              - profile
      
# 앱 PKCE 기반 설정
  oauth:
    google:
      client-id: test_id
      client-secret: test_secret
      redirect-uri: com.example.app:/oauth2redirect  # 예시

# 페이징 기능으로 클라이언트가 요청하여 한 번에 최대 검색 가능한 게시글 수를 50개로 제한한다.
  data:
    web:
      pageable:
        max-page-size: 50

jwt:
  issuer: ajufresh@gmail.com
  secret_key: your-very-long-and-secure-random-secret-key-at-least-32-characters-long
# 키가 바뀔 때 마다 토큰을 재발급 해야함

# 클라우디너리 설정 
cloudinary:
  cloud-name:
  api-key:
  api-secret:


app:
  base-url: http://localhost:3000 # 로컬 프론트엔드 주소 (운영 시에는 운영 서버 주소로 변경)
