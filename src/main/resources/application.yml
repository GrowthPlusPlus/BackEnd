spring:
  datasource:
    url: jdbc:h2:mem:testdb  # db값이 유지되도록 나중에 바꿔야 한다
    username: sa

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true

# 웹 기반 OAUTH 설정으로 비활성화
