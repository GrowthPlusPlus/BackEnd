spring:
  #배포시 active: prod 사용 (default로 설정 시 로컬에서 db를 찾음)
  profiles:
    active: prod

  datasource:
    url: jdbc:postgresql://dpg-d5ubio4oud1c73bk5he0-a.virginia-postgres.render.com/hanaemdb
    username: haneul
    password: JuWVt8IzASwO4LIkmNNux96Q67hYqXN5
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      #엔티티 클래스를 수정하면 구조에 맞춰 테이블을 자동으로 생성/수정
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        #데이터베이스 초기화 시점을 hibernate가 테이블을 다 생성한 이후로 미룸
    defer-datasource-initialization: true

  h2:
    console:
      enabled: false

# data.sql을 실행하지 않는다.
  sql:
    init:
      mode: never
      
