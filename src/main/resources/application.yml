    password: AVNS__yupPU6qosmn6Cmvtp4
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      #엔티티 클래스를 수정하면 구조에 맞춰 테이블을 자동으로 생성/수정
      ddl-auto: update
    show-sql: true
