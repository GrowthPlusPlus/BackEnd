spring:
  datasource:
    url: jdbc:h2:mem:testdb  # db값이 유지되도록 나중에 바꿔야 한다
    username: sa

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true

# data.sql을 실행하지 않는다.
  sql:
    init:
      mode: never
      
# 앱 PKCE 기반 설정
  oauth:
    google:
      client-id: 433865217738-5gr9oq66ef2bffc1r8ik065oc45iopg5.apps.googleusercontent.com
      client-secret: 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
      redirect-uri: com.example.app:/oauth2redirect  # 예시로 추후에 교체해야 한다.
      # com.example.app → 앱의 패키지명 / 번들 ID
      # /oauth2redirect → 개발자가 정하는 경로 (고정 문자열)

# 페이징 기능으로 클라이언트가 요청하여 한 번에 최대 검색 가능한 게시글 수를 50개로 제한한다.
  data:
    web:
      pageable:
        max-page-size: 50

