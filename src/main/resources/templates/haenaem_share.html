<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해냄 공유 이미지 템플릿</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --primary-green: #00A163;
      --bg-main: #FBFBF8;
      --gray-black: #1B1D1B;
      --gray-1: #444444;
      --gray-2: #616161;
      --gray-3: #8C8C8C;
      --gray-4: #D9D9D9;
      --gray-5: #EDEEEA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif;
    }

    body {
      background-color: #E5E5E5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 모바일 최적화 규격 (가로 375px) */
    .share-card {
      width: 375px;
      padding: 28px;
      background: var(--bg-main);
      box-shadow:
        0px 2px 8px -4px rgba(15, 20, 28, 0.12),
        0px 10px 24px -10px rgba(15, 20, 28, 0.18),
        0px 1px 0px rgba(255, 255, 255, 0.60) inset;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 배경 효과 축소 */
    .bg-effect-1,
    .bg-effect-2 {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(0, 153, 81, 0.10) 0%, rgba(0, 153, 81, 0) 70%);
      border-radius: 50%;
      z-index: 0;
    }

    .bg-effect-1 {
      left: 180px;
      top: -150px;
    }

    .bg-effect-2 {
      left: -150px;
      top: 380px;
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
    }

    /* 상단 배지 */
    .badge-wrapper {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      background: rgba(0, 153, 81, 0.06);
      border-radius: 999px;
      outline: 1px rgba(0, 153, 81, 0.22) solid;
      outline-offset: -1px;
      gap: 6px;
      width: max-content;
    }

    .badge-dot-container {
      width: 4px;
      height: 4px;
      background: var(--primary-green);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .badge-dot-shadow {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      box-shadow: 0px 0px 0px 2px rgba(0, 153, 81, 0.15);
    }

    .badge-text {
      color: var(--primary-green);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    /* 타이틀 */
    .title {
      color: var(--gray-black);
      font-size: 28px;
      font-weight: 800;
      line-height: 1.3;
      padding-bottom: 8px;
      word-break: keep-all;
    }

    /* 이번달 달성 횟수 */
    .monthly-stat-wrap {
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--gray-4);
      gap: 6px;
    }

    .monthly-label {
      color: var(--gray-1);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .monthly-count {
      color: var(--primary-green);
      font-size: 28px;
      font-weight: 800;
      line-height: 28px;
    }

    .monthly-total {
      color: var(--gray-1);
      font-size: 12px;
      font-weight: 500;
      line-height: 12px;
    }

    /* 캘린더 영역 (비율 기반 자동 맞춤) */
    .calendar-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .weekday {
      text-align: center;
      color: var(--gray-3);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    /* 캘린더 날짜 칸 */
    .day {
      aspect-ratio: 1;
      /* 가로세로를 완벽한 1:1 비율로 강제 */
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      font-weight: 400;
      position: relative;
      overflow: hidden;
    }

    .day.empty {
      background: transparent;
      color: transparent;
    }

    .day.done {
      background: var(--primary-green);
      color: white;
    }

    .day.not-done {
      background: var(--gray-5);
      color: var(--gray-2);
    }

    .day.photo {
      color: white;
      background-size: cover;
      background-position: center;
    }

    .day.photo::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(0deg, rgba(0, 0, 0, 0.20) 0%, rgba(0, 0, 0, 0.20) 100%);
      z-index: 0;
    }

    .day.photo span{
      position:relative;
      z-index:1;
     }

    /* 하단 누적 달성 영역 */
    .total-stat-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      padding-bottom: 8px;
      margin-top: 8px;
    }

    .total-date {
      color: var(--gray-1);
      font-size: 14px;
      font-weight: 600;
      opacity: 0.85;
    }

    .total-message {
      color: var(--gray-black);
      font-size: 32px;
      font-weight: 900;
      line-height: 1.2;
      display: flex;
      align-items: center;
    }

    .total-message .highlight {
      color: var(--primary-green);
    }

    /* 푸터 */
    .footer {
      border-top: 1px solid var(--gray-4);
      padding-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }

    .logo-text {
      color: var(--gray-black);
      font-size: 16px;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <!-- 캡처될 실제 영역 -->
  <div class="share-card">

    <div class="bg-effect-1"></div>
    <div class="bg-effect-2"></div>

    <div class="content-wrapper badge-wrapper">
      <div class="badge-dot-container">
        <div class="badge-dot-shadow"></div>
      </div>
      <span class="badge-text" id="v-badge-text">MONTH · YEAR · CHALLENGE</span>
    </div>

    <div class="content-wrapper title" id="v-title">challenge title</div>

    <div class="content-wrapper monthly-stat-wrap">
      <div class="monthly-label">이번달 해낸 횟수</div>
      <div>
        <span class="monthly-count" id="v-monthly-done">00</span>
        <span class="monthly-total">/<span id="v-monthly-total">00</span></span>
      </div>
    </div>

    <div class="content-wrapper calendar-container">
      <div class="weekdays">
        <div class="weekday">일</div>
        <div class="weekday">월</div>
        <div class="weekday">화</div>
        <div class="weekday">수</div>
        <div class="weekday">목</div>
        <div class="weekday">금</div>
        <div class="weekday">토</div>
      </div>
      <div class="days" id="v-calendar-grid">
        <!-- JS로 동적 생성됨 -->
      </div>
    </div>

    <div class="content-wrapper total-stat-wrap">
      <div class="total-date" id="v-start-date">0000년 00월 00일부터</div>
      <div class="total-message">
        총&nbsp;<span class="highlight" id="v-total-done">00일</span>&nbsp;해냈어요!
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // 렌더링 함수 (백엔드 스크립트에서 호출)
    // ==========================================
    async function renderShareImage(data) {
      document.getElementById('v-badge-text').innerText = data.badgeText;
      document.getElementById('v-title').innerText = data.title;
      document.getElementById('v-monthly-done').innerText = data.monthlyDone;
      document.getElementById('v-monthly-total').innerText = data.monthlyTotal;
      document.getElementById('v-start-date').innerText = `${data.startDate}부터`;
      document.getElementById('v-total-done').innerText = `${data.totalDone}일`;

      const grid = document.getElementById('v-calendar-grid');
      grid.innerHTML = ''; // 초기화

      // 1. 시작 요일 전까지 빈 칸 채우기
      for (let i = 0; i < data.startDayOfWeek; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'day empty';
        grid.appendChild(emptyDiv);
      }

      // 2. 실제 날짜 채우기
      data.days.forEach(dayInfo => {
        const dayDiv = document.createElement('div');

        dayDiv.className = `day ${dayInfo.status}`;

        const span = document.createElement('span');
        span.innerText = dayInfo.date;
        dayDiv.appendChild(span);

        // 사진 인증일 경우 배경 이미지 삽입
        if (dayInfo.status === 'photo' && dayInfo.photoUrl) {
          dayDiv.style.backgroundImage = `url(${dayInfo.photoUrl})`;
        }

        grid.appendChild(dayDiv);
      });

      // 이미지가 모두 로드되고 캡쳐하도록 대기
      const promises = [];

      data.days.forEach(dayInfo => {
        if (dayInfo.status === "photo" && dayInfo.photoUrl) {
          promises.push(new Promise(resolve => {
            const img = new Image();
            img.onload = resolve;
            img.onerror = resolve;
            img.src = dayInfo.photoUrl;
          }));
        }
      });

      return Promise.all(promises);
    }

    // Playwright가 호출할 수 있도록 전역 등록
    window.renderShareImage = renderShareImage;
  </script>
</body>
